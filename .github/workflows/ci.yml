name: ci_1

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  config:
    runs-on: ubuntu-latest

    steps:
      - name: Show selected Environment
        run: |
          echo "Selected Environment ${{ inputs.environment }}"

  production:
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest

    steps:
      - name: Production Deployment
        run: |
          echo "Running Production job ${{ github.run_number }}"

  validation:
    if: ${{ inputs.environment != 'prod' }}
    runs-on: ubuntu-latest

    steps:
      - name: Show warning
        run: |
          echo "You are not supposed to deploy: ${{ inputs.environment }}"
  
  warn:
    needs: production
    if: ${{ failure() }}
    runs-on: ubuntu-latest

    steps:
      - name: Sound warning
        run: |
          echo "WHY DID YOU DEPLOY: ${{ inputs.environment }}"