name: ci_1

on:
  workflow_dispatch: # running on manual trigger
  # push:
  #   branches: # runs after pushing to main branch
  #     - main
  # pull_request:
  #   branches: # runs after pull request targetting any branch
  #     - "**"
env:
  SCOPE_TEST: workflow-value

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SCOPE_TEST: job_value

    steps:
      - name: Workflow_scope
        run: echo "SCOPE_TEST=$SCOPE_TEST"
      
      - name: Step_scope
        env:
          SCOPE_TEST: step_value
        run: echo "SCOPE_TEST=$SCOPE_TEST"
      
      - name: Back to Job Scope
        run: echo "SCOPE_TEST= $SCOPE_TEST"
