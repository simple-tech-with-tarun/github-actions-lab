name: ci_1

on:
  workflow_dispatch: 

jobs:
   build:
     runs-on: ubuntu-latest
     
     steps:
      - name: Build
        run: |
          echo "Building.."
     
      - name: Restore Dependencies Cache
        uses: actions/cache@v4
        with:
          path: dependencies
          key: dependencies-${{ runner.os }}-v2
     
      - name: Create Dependency Data
        run: |
          if [ -f dependencies/dependency.txt ]; then
            echo "Dependency already exists — using cached dependency"
          else
           mkdir -p dependencies
           echo "Dependency created during the run ${{ github.run_number }}" > dependencies/dependency.txt
           echo "Dependency created - cache was empty"
          fi

      - name: Show Dependency Data
        run: |
          cat dependencies/dependency.txt
