name: ci_1

on:
  push:
    branches:
      - "**" 
      - "!main"  # we can use branches-ignore is we want to just ignore few branches and leave the others
                 # or '!' will be used to mention which branch to ignore.
                 # both branches and branches-ignore can not be used at the same time.

jobs:
   config:
     runs-on: ubuntu-latest
     
     env:
       APP_ENV: lab

     steps:
      - name: Default
        run: |
          echo "Job_var : $APP_ENV"
     
      - name: Override
        env:
          APP_ENV: Test
        run: |
          echo "Step_var: $APP_ENV"

      - name: After Override
        run: |
          echo "APP_ENV : $APP_ENV" 