name: ci_1

on:
  workflow_dispatch: # running on manual trigger
  # push:
  #   branches: # runs after pushing to main branch
  #     - main
  # pull_request:
  #   branches: # runs after pull request targetting any branch
  #     - "**"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Validate
      #   run: echo "GitHub actions CLI is working"

      - name: Show GitHub Context
        run: |
          echo "Operating System: $RUNNER_OS"
          echo "Branch/ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
