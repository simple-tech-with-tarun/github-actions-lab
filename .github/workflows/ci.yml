name: ci_1

on:
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
  
    steps:
      - name: test job
        run: echo "Test Job validated"
  
  build:
    needs: test
    runs-on: ubuntu-latest

    outputs: 
      app_version: ${{ steps.generate_version.outputs.step_version }}
      app_delta: ${{ steps.generate_version.outputs.delta}}
      
    steps:
      - name: Generate version
        id: generate_version
        run: | 
          echo "step_version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "delta=3.0.0${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "step_version=1.0.${{ github.run_number }}"
          echo "delta=3.0.0${{ github.run_number }}"

      - name: Build
        run: |
          echo "Building version: ${{ steps.generate_version.outputs.step_version }}"
          echo "Running version: ${{ steps.generate_version.outputs.delta}}"

      - name: Create Build Info
        run: |
          mkdir -p build_artifacts
          echo "Application version: ${{ steps.generate_version.outputs.step_version }}" > build_artifacts/build-info.txt
          echo "Running version: ${{ steps.generate_version.outputs.delta}}" >> build_artifacts/build-info.txt
          echo "Build run: ${{ github.run_number }}" >> build_artifacts/build-info.txt

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with: 
          name: build-info
          path: build_artifacts/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploying version: ${{needs.build.outputs.app_version}}"
    
      - name: Download Build Info
        uses: actions/download-artifact@v5
        with:
          name: build-info
          path: build_artifacts
  
      - name: Read Build Info
        run: |
          echo "Contents of artifact: Build Info"
          cat build_artifacts/build-info.txt