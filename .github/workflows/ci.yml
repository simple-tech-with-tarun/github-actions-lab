name: ci_1

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 25
          - 45
        
        os:
          - windows-latest
          - ubuntu-latest
        
        include:
          - os: windows-latest
            node-version: 100
          
          - node-version: 142
            os: windows-latest
        
        exclude:
          - os: ubuntu-latest
            node-version: 25
                     

    steps:
      - name: Show Node version
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Selected Node version: ${{ matrix.node-version }}"

          if ( "${{ matrix.node-version}}" == "25"); then
            echo "Intentional Failure"
            exit 1
          fi