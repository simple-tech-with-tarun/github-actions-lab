name: CICD Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Repository
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF"
          echo "Validation passed"

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Run test1
        run: | 
          echo "Running tests..."
          sleep 5
          echo "Tests passed"